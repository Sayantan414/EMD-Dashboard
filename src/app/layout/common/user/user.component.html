<!-- Button -->
<button mat-button [matMenuTriggerFor]="userActions">
  <span class="flex flex-row items-center justify-center">
    <img
      class="w-7 h-7 rounded-full"
      *ngIf="showAvatar && user.imageUrl"
      [src]="user.imageUrl"
      style="
        border: 1px solid #fff;
        background: #ffffffbf;
        max-width: 5rem !important;
      "
    />
    <mat-icon
      class="icon-size-7"
      *ngIf="!showAvatar || !user.imageUrl"
      [svgIcon]="'heroicons_outline:user-circle'"
    ></mat-icon>
    <span class="rounded-full font-medium text-white ml-2" *ngIf="showUserName"
      >{{ user.firstname }} {{ user.lastname }}</span
    >
  </span>
</button>

<mat-menu [xPosition]="'before'" #userActions="matMenu" class="corporate-menu">

  <!-- User Info Section -->
  <div class="user-menu-header" (click)="$event.stopPropagation()">
    <div class="user-avatar-circle">
      <mat-icon style="font-size:20px; width:20px; height:20px; color:#fff;">person</mat-icon>
    </div>
    <div class="user-info-block">
      <span class="user-signed-label">Signed in as</span>
      <span class="user-role-name">{{ user.role }}</span>
    </div>
  </div>

  <mat-divider></mat-divider>

  <!-- Sign Out Button -->
  <button mat-menu-item (click)="signOut()" class="signout-btn">
    <mat-icon class="signout-icon">logout</mat-icon>
    <span class="signout-label">Sign Out</span>
  </button>

</mat-menu>
