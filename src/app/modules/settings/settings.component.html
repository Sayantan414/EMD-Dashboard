<div class="container">
  <div class="card" role="region" aria-label="Parameters table">
    <div class="card-header">
      <div class="title">
        <div class="dot" aria-hidden="true"></div>
        <div>
          <h2>Parameters</h2>
          <div class="subtitle">Quick reference for current settings</div>
        </div>
      </div>
      <div class="subtitle">4 items • updated just now</div>
    </div>

    <div class="table-wrap" role="table" aria-label="Parameter table">
      <table>
        <thead>
          <tr>
            <th scope="col">
              <span *ngFor="let char of splitLetters('Parameter'); let i = index" [style.animation-delay]="(i * 0.2) + 's'">{{ char }}</span>
            </th>
            <th scope="col">
              <span *ngFor="let char of splitLetters('Value'); let i = index" [style.animation-delay]="(i * 0.2) + 's'">{{ char }}</span>
            </th>
            <th scope="col" style="text-align: right">
              <span *ngFor="let char of splitLetters('Action'); let i = index" [style.animation-delay]="(i * 0.2) + 's'">{{ char }}</span>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>
              <div class="param">
                <div class="icon" aria-hidden="true">B</div>
                <div class="label">
                  <div class="name">BF#5 Gasmake Multiplier</div>
                  <div class="note">Value multiply with blast volume</div>
                </div>
              </div>
            </td>
            <td>
              <div class="value">
                <span class="pill">1.52</span>
                <!-- <span class="muted">secure</span> -->
              </div>
            </td>
            <td>
              <div
                class="actions"
                role="group"
                aria-label="Actions for API Endpoint"
              >
                <button class="btn edit" title="Edit">
                  <!-- edit icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                      fill="currentColor"
                    />
                  </svg>
                  Edit
                </button>
                <button class="btn default" title="Default">
                  <!-- restore/undo icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"
                      fill="currentColor"
                    />
                  </svg>
                  Default
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <td>
              <div class="param">
                <div class="icon" aria-hidden="true">T</div>
                <div class="label">
                  <div class="name">Timeout</div>
                  <div class="note">Request timeout</div>
                </div>
              </div>
            </td>
            <td>
              <div class="value">
                <span class="pill">15s</span>
                <span class="muted">recommended</span>
              </div>
            </td>
            <td>
              <div class="actions">
                <button class="btn edit" title="Edit">
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                      fill="currentColor"
                    />
                  </svg>
                  Edit
                </button>
                <button class="btn copy" title="Copy">
                  <!-- copy icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M16 1H4a2 2 0 00-2 2v12h2V3h12V1zM20 5H8a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2zm0 16H8V7h12v14z"
                      fill="currentColor"
                    />
                  </svg>
                  Copy
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <td>
              <div class="param">
                <div class="icon" aria-hidden="true">L</div>
                <div class="label">
                  <div class="name">Log Level</div>
                  <div class="note">Verbosity</div>
                </div>
              </div>
            </td>
            <td>
              <div class="value">
                <span class="pill">Info</span>
                <span class="muted">default</span>
              </div>
            </td>
            <td>
              <div class="actions">
                <button class="btn change" title="Change">
                  <!-- swap/exchange icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M6.99 11L3 15l3.99 4v-3H14v-2H6.99v-3zM21 9l-3.99-4v3H10v2h7.01v3L21 9z"
                      fill="currentColor"
                    />
                  </svg>
                  Change
                </button>
                <button class="btn toggle" title="Toggle">
                  <!-- toggle / enable icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M7 12a5 5 0 0010 0 5 5 0 00-10 0zm0 0a7 7 0 0114 0v4a3 3 0 01-3 3H6a3 3 0 01-3-3v-4a7 7 0 0114 0z"
                      fill="currentColor"
                    />
                  </svg>
                  Toggle
                </button>
              </div>
            </td>
          </tr>

          <tr>
            <td>
              <div class="param">
                <div class="icon" aria-hidden="true">C</div>
                <div class="label">
                  <div class="name">Cache</div>
                  <div class="note">Client-side cache</div>
                </div>
              </div>
            </td>
            <td>
              <div class="value">
                <span class="pill">Enabled</span>
                <span class="muted">ttl 3600s</span>
              </div>
            </td>
            <td>
              <div class="actions">
                <button class="btn configure" title="Configure">
                  <!-- settings gear icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"
                      fill="currentColor"
                    />
                  </svg>
                  Configure
                </button>
                <button class="btn delete" title="Disable">
                  <!-- block/disable icon -->
                  <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path
                      d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zM4 12c0-4.42 3.58-8 8-8 1.85 0 3.55.63 4.9 1.69L5.69 16.9C4.63 15.55 4 13.85 4 12zm8 8c-1.85 0-3.55-.63-4.9-1.69L18.31 7.1C19.37 8.45 20 10.15 20 12c0 4.42-3.58 8-8 8z"
                      fill="currentColor"
                    />
                  </svg>
                  Disable
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
