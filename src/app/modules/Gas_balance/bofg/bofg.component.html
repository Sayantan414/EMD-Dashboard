<div class="mainDiv">
    <div class="radio-buttons-container">
      <div class="mode-switch">
        <label class="switch-option">
          <input
            type="radio"
            name="viewMode"
            value="bofg"
            [(ngModel)]="viewMode"
          />
          <span class="custom-radio"></span>
         BOFG
        </label>
  
        <label class="switch-option">
          <input
            type="radio"
            name="viewMode"
            value="report"
            [(ngModel)]="viewMode"
          />
          <span class="custom-radio"></span>
          Report
        </label>
  
        <label class="switch-option">
          <input
            type="radio"
            name="viewMode"
            value="trends"
            [(ngModel)]="viewMode"
            (change)="onViewModeChange()"
          />
          <span class="custom-radio"></span>
          Trends
        </label>
      </div>
    </div>
    <div *ngIf="viewMode === 'bofg'">
      <div class="layout-container">
        <div class="detail-view">
          <h3 class="animated-underline">BOFG</h3>
          <!-- <div class="detail-content"> -->

        </div>
  

  
        <div class="gasflow-container m-10 ml-60">
          <h2 class="title animated-underline">BOFG</h2>
  
          <div class="tree">
            <!-- Continuous main vertical line -->
            <div class="main-line"></div>
  
            <!-- Top Node -->
            <div class="node generation gen">
              <div class="top_header">BOFG</div>
              <div class="sub-title red">Generation</div>
              <div class="labels unique">
                <span>Flow</span><span>Pressure</span>
              </div>
              <div class="values unique">
                <div>
                  <div class="value">xxxx</div>
                  <div class="unit">Nm³/hr</div>
                </div>
                <div>
                  <div class="value">xxxx</div>
                  <div class="unit">mmwc</div>
                </div>
              </div>
            </div>
  
            <!-- LEVEL 1 -->
            <div class="branch exportVolume" style="margin-top: 2%">
              <div class="node consumption left flow-box">
                <div class="header">EXPORT VOLUME</div>
                <div class="sub-title green">Consumption</div>
                <div class="labels"><span>Total Flow</span></div>
                <div class="values">
                  <div>
                    <div class="value">xxxx</div>
                    <div class="unit">Nm³/hr</div>
                  </div>
                </div>
                <div class="labels"><span>N1</span><span>N2</span></div>
                <div class="values">
                  <div>
                    <div class="value">xxxx</div>
                    <div class="unit">Nm³/hr</div>
                  </div>
                  <div>
                    <div class="value">xxxx</div>
                    <div class="unit">mmwc</div>
                  </div>
                </div>
              </div>
            </div>
  
            <!-- Example: Single right-side node -->
            <div class="branch single-right">
              <div class="node consumption right flow-box">
                <div class="header">MILLS</div>
                <div class="sub-title green">Consumption</div>
                <div class="labels unique">
                  <span>Flow</span><span>Pressure</span>
                </div>
                <div class="values">
                  <div>
                    <div class="value">xxxx</div>
                    <div class="unit">Nm³/hr</div>
                  </div>
                  <div>
                    <div class="value">
                      xxxx
                    </div>
                    <div class="unit">mmwc</div>
                  </div>
                </div>
              </div>
            </div>
  
            <!-- LEVEL 1 -->
            <div class="branch single-left">
          <div class="node consumption left flow-box">
            <div class="header">PBS#2</div>
            <div class="sub-title green">Consumption</div>
            <div class="labels unique">
              <span>Flow</span><span>Pressure</span>
            </div>
            <div class="values">
              <div>
                <div class="value">xxxx</div>
                <div class="unit">Nm³/hr</div>
              </div>
              <div>
                <div class="value">xxxx</div>
                <div class="unit">mmwc</div>
              </div>
            </div>
          </div>
        </div>
          </div>
        </div>
      </div>
    </div>
  </div>
